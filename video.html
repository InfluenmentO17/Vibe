<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scène ONECI — Vibeathon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent-color: #C9A84C;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #video-container {
            position: relative;
            width: 800px;
            height: 450px;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 2px solid var(--accent-color);
        }

        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 1s;
        }

        .family-container {
            position: absolute;
            bottom: 20px;
            left: 10%;
            display: flex;
            align-items: flex-end;
            gap: 15px;
            z-index: 10;
        }

        /* Styles pour les personnages SVG */
        .person {
            position: relative;
            transition: transform 0.5s;
        }

        .person svg {
            display: block;
        }

        .subtitle-box {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 15px 25px;
            border-radius: 8px;
            max-width: 80%;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.4;
            border-left: 4px solid var(--accent-color);
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 20;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(201,168,76,0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
        }

        .instructions {
            margin-top: 20px;
            color: #888;
            font-size: 0.9rem;
        }

        /* Animation des personnages */
        @keyframes walk {
            0% { transform: translateX(-100px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes talk {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.05); }
        }

        .walking {
            animation: walk 2s forwards ease-out;
        }

        .talking {
            animation: talk 0.2s infinite;
        }
    </style>
</head>
<body>

    <h1>Générateur de Vidéo Sensibilisation</h1>

    <div id="video-container">
        <!-- Fond ONECI (Placeholder si l'image n'est pas là) -->
        <img id="background" src="oneci.jpg" alt="Fond ONECI" onerror="this.src='https://via.placeholder.com/800x450/222/888?text=Fond+ONECI+Manquant'">
        
        <div class="family-container" id="family">
            <!-- Papa (55 ans) -->
            <div class="person" id="papa">
                <svg width="60" height="160" viewBox="0 0 60 160">
                    <rect x="10" y="40" width="40" height="100" fill="#C9A84C" /> <!-- Agbada -->
                    <circle cx="30" cy="25" r="15" fill="#5D4037" /> <!-- Tête -->
                    <rect x="15" y="10" width="30" height="10" fill="#C9A84C" /> <!-- Chapeau (Fila) -->
                    <rect x="15" y="70" width="10" height="15" fill="#fff" /> <!-- Documents -->
                </svg>
            </div>
            <!-- Maman (45 ans) -->
            <div class="person" id="maman">
                <svg width="55" height="150" viewBox="0 0 55 150">
                    <path d="M5,40 L50,40 L45,140 L10,140 Z" fill="#8E24AA" /> <!-- Buba -->
                    <circle cx="27" cy="25" r="14" fill="#6D4C41" />
                    <ellipse cx="27" cy="15" rx="20" ry="10" fill="#8E24AA" /> <!-- Gele -->
                </svg>
            </div>
            <!-- Enfant 18 ans -->
            <div class="person">
                <svg width="50" height="140" viewBox="0 0 50 140">
                    <rect x="10" y="40" width="30" height="90" fill="#2E7D32" />
                    <circle cx="25" cy="25" r="13" fill="#5D4037" />
                </svg>
            </div>
            <!-- Enfant 13 ans -->
            <div class="person">
                <svg width="45" height="120" viewBox="0 0 45 120">
                    <rect x="10" y="35" width="25" height="80" fill="#1565C0" />
                    <circle cx="22" cy="22" r="11" fill="#6D4C41" />
                </svg>
            </div>
            <!-- Bébé 3 mois (porté par maman ou séparé) -->
            <div class="person">
                <svg width="30" height="50" viewBox="0 0 30 50">
                    <rect x="5" y="20" width="20" height="25" fill="#fff" />
                    <circle cx="15" cy="12" r="8" fill="#8D6E63" />
                </svg>
            </div>
        </div>

        <div class="subtitle-box" id="subtitle"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="startScene()">Lancer la scène</button>
        <button class="btn btn-secondary" onclick="recordScene()">Enregistrer (WebM)</button>
    </div>

    <div class="instructions">
        Note : Assurez-vous d'avoir l'image "oneci.jpg" dans le dossier pour le fond.
    </div>

    <script>
        const text = "Je suis ressortissant CEDEAO, ma famille et moi venons faire nos cartes de résident CEDEAO pour avoir le Numéro National d’identification ainsi intégré le RNP. Faites comme nous.";
        const papa = document.getElementById('papa');
        const subtitle = document.getElementById('subtitle');
        const family = document.getElementById('family');

        function startScene() {
            // Reset
            family.classList.remove('walking');
            void family.offsetWidth; // trigger reflow
            family.classList.add('walking');
            
            subtitle.style.opacity = 0;
            
            setTimeout(() => {
                speak();
            }, 2000);
        }

        function speak() {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 0.9;
            
            utterance.onstart = () => {
                papa.classList.add('talking');
                subtitle.innerText = text;
                subtitle.style.opacity = 1;
            };
            
            utterance.onend = () => {
                papa.classList.remove('talking');
                setTimeout(() => {
                    subtitle.style.opacity = 0;
                }, 2000);
            };
            
            window.speechSynthesis.speak(utterance);
        }

        async function recordScene() {
            alert("L'enregistrement va commencer. Cliquez sur 'Lancer la scène' après avoir autorisé le téléchargement.");
            // Logique de capture canvas simplifiée pour l'exemple
            // (Nécessite de dessiner les éléments sur un <canvas> au lieu de DOM pour un vrai export vidéo)
        }
    </script>
</body>
</html>
